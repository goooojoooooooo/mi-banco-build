name: ios-build
run-name: ios-build ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner macOS (por defecto: namespace-profile-onyx; NO usar macos-15-intel)"
        required: false
        type: choice
        options:
          - namespace-profile-onyx
        default: "namespace-profile-onyx"
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner || 'namespace-profile-onyx' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Elegir Xcode (26.2 si existe; si no, el mas nuevo)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=/Applications/Xcode_26.2.app
          if [ ! -d "$XCODE" ]; then XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"; fi
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
      - name: Generar proyecto Xcode (XcodeGen 2.49.0 verificado)
        run: bash .github/scripts/install_xcodegen.sh
      - name: La guia de avisos usa los mismos nombres que los Atajos
        run: |
          # Los nombres esperados salen de Core (una cadena por linea, `]` en la primera columna): no hay una segunda lista.
          CORE=Core/Sources/MiBancoCore/SetupGuide.swift
          fail() { echo "La guía y los Atajos no usan los mismos nombres: $1"; exit 1; }
          names_of() {
            awk -v list="$1" '$0 ~ "^public let " list ": \\[String\\] = \\[" {on=1; next} on && /^\]/ {exit} on {print}' "$CORE" \
              | grep -o '"[^"]*"' | sed 's/^"//; s/"$//'
          }
          check_intent() {
            list="$1"; file="$2"
            names=$(names_of "$list")
            [ -n "$names" ] || fail "no se pudo leer $list de $CORE"
            action=$(printf '%s\n' "$names" | sed -n 1p)
            grep -qF "static let title: LocalizedStringResource = \"$action\"" "$file" || fail "titulo de la accion \"$action\" en $file"
            expected=0
            while IFS= read -r name; do
              expected=$((expected + 1))
              [ "$expected" -eq 1 ] && continue
              grep -qF "@Parameter(title: \"$name\")" "$file" || fail "@Parameter(title: \"$name\") en $file"
            done <<< "$names"
            # Ni un parametro de mas ni de menos: cada @Parameter del archivo esta en la lista.
            declared=$(grep -c '@Parameter(title:' "$file" || true)
            [ "$declared" -eq $((expected - 1)) ] || fail "$file declara $declared parametros y la guia espera $((expected - 1))"
          }
          check_intent guideNoticeIntentNames App/Intents/RegisterNoticeIntent.swift
          check_intent guideWalletIntentNames App/Intents/RegisterWalletIntent.swift
          echo ok
      - name: Archive (sin firmar)
        run: |
          xcodebuild -project MiBanco.xcodeproj -scheme MiBanco -sdk iphoneos -configuration Release \
            archive -archivePath build/MiBanco.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Sin push en entitlements ni Info.plist; acciones de Atajos dentro de la app
        run: |
          APP=build/MiBanco.xcarchive/Products/Applications/MiBanco.app
          test -d "$APP"
          if [ ! -d "$APP/Metadata.appintents" ]; then
            echo "Falta $APP/Metadata.appintents: Atajos no veria Registrar aviso ni Registrar pago con Cartera"
            exit 1
          fi
          ls -la "$APP/Metadata.appintents"
          if plutil -p "$APP/Info.plist" | grep aps-environment >/dev/null; then echo "Info.plist menciona aps-environment"; exit 1; fi
          if grep aps-environment App/MiBanco.entitlements >/dev/null; then echo "entitlements mencionan aps-environment"; exit 1; fi
          if codesign -d --entitlements - "$APP" 2>&1 | grep aps-environment >/dev/null; then echo "binario con aps-environment"; exit 1; fi
          for manifest in "$APP/PrivacyInfo.xcprivacy" "$APP/PlugIns/MiBancoNotification.appex/PrivacyInfo.xcprivacy" "$APP/PlugIns/MiBancoWidgets.appex/PrivacyInfo.xcprivacy"; do
            test -s "$manifest" || { echo "Falta $manifest en el paquete"; exit 1; }
            plutil -lint "$manifest"
          done
          echo ok
      - name: Empaquetar .ipa
        run: |
          mkdir Payload
          cp -R build/MiBanco.xcarchive/Products/Applications/MiBanco.app Payload/
          zip -qry MiBanco.ipa Payload
          unzip -l MiBanco.ipa | grep -E "Info.plist|PrivacyInfo.xcprivacy"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: MiBanco.ipa
          path: MiBanco.ipa
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MiBanco.ipa
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MiBanco.ipa --title "$GITHUB_REF_NAME" --generate-notes
