name: screenshots
run-name: screenshots ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      pequeno:
        description: "Todo en un iPhone de 393 pt (iPhone 15/16), y ademas capturas pequeno de la guia"
        type: boolean
        default: false
      runner:
        description: "Runner macOS (por defecto: namespace-profile-onyx; NO usar macos-15-intel)"
        required: false
        default: "namespace-profile-onyx"
permissions:
  contents: read
jobs:
  capturas:
    runs-on: ${{ inputs.runner || 'namespace-profile-onyx' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Elegir Xcode con runtime de iOS (el mas nuevo; si no, Xcode 16.4)
        run: |
          ls -d /Applications/Xcode*.app
          CHOSEN=""
          for app in /Applications/Xcode_26.2.app $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
            [ -d "$app" ] || continue
            echo "Probando $app"
            if DEVELOPER_DIR="$app/Contents/Developer" xcrun simctl list runtimes available | grep -E "^iOS " ; then
              CHOSEN="$app"; break
            fi
            echo "Sin runtime de iOS usable en $app"
          done
          if [ -z "$CHOSEN" ]; then echo "Ningun Xcode tiene runtime de iOS"; exit 1; fi
          sudo xcode-select -s "$CHOSEN"
          echo "DEVELOPER_DIR=$CHOSEN/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen
      - name: Crear y arrancar el simulador
        timeout-minutes: 12
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i "iphone 1[67]" || true
          RUNTIME_LINE=$(xcrun simctl list runtimes available | grep -E "^iOS .*com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]+-[0-9]+$" | sort -V | tail -1 || true)
          if [ -z "$RUNTIME_LINE" ]; then
            RUNTIME_LINE=$(xcrun simctl list runtimes available | grep -E "^iOS " | sort -V | tail -1)
          fi
          RUNTIME=$(echo "$RUNTIME_LINE" | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.[^[:space:]]+")
          DEVICETYPE=$(xcrun simctl list devicetypes | grep -E "iPhone [0-9]+ Pro Max" | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/' | sort -V | tail -1)
          # G30 M5: exige un iPhone de 393 pt (15/16) y falla si no existe, sin elegir 402 pt en silencio.
          if [ "${{ inputs.pequeno }}" = "true" ]; then
            DEVICETYPE=$(xcrun simctl list devicetypes | grep -E "^iPhone (15|16) \(" | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/' | sort -V | head -1 || true)
            if [ -z "$DEVICETYPE" ]; then
              echo "No se encontro un simulador de 393 pt (iPhone 15 o 16) para pequeno=true"
              xcrun simctl list devicetypes | grep -E "^iPhone " || true
              exit 1
            fi
          fi
          echo "Runtime: $RUNTIME_LINE"
          echo "Dispositivo: $DEVICETYPE"
          UDID=$(xcrun simctl create "MiBancoShots" "$DEVICETYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Creado $UDID; arrancando"
          xcrun simctl boot "$UDID"
          echo "boot enviado"
          perl -e 'alarm 480; exec @ARGV' xcrun simctl bootstatus "$UDID" -b
          echo "bootstatus ok"
          {
            echo "### Entorno de capturas"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- Runtime: $RUNTIME_LINE"
            echo "- Dispositivo: $DEVICETYPE"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compilar Debug para el simulador
        run: |
          xcodebuild -project MiBanco.xcodeproj -scheme MiBanco -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build/dd build CODE_SIGNING_ALLOWED=NO
      - name: Capturas
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/MiBanco.app
          test -d "$APP"
          mkdir -p out
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          # Una captura por estado: lanza, espera y fotografia una vez (sin rafagas).
          shot() {
            name="$1"; wait="$2"; shift 2
            xcrun simctl launch "$UDID" com.mibanco.app -MiBancoDemo "$@" -AppleLanguages "(es)" -AppleLocale es_ES
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "out/$name.png"
            xcrun simctl terminate "$UDID" com.mibanco.app || true
            sleep 3
          }
          shot inicio-todo 10 -MiBancoDemoCard todo
          shot inicio-revolut 10 -MiBancoDemoCard rev
          # Arranca en Revolut y a los 2 s pasa a imagin por el mismo camino que un toque en el segmentado.
          shot inicio-imagin 10 -MiBancoDemoCard rev -MiBancoDemoSwitch
          shot detalle 10 -MiBancoDemoDetail
          shot detalle-categoria 10 -MiBancoDemoDetailCategory
          shot privado 10 -MiBancoDemoPrivate
          shot buscar 10 -MiBancoDemoSearch merca
          shot gasto 10 -MiBancoDemoScreen gasto
          shot gasto-mes-anterior 10 -MiBancoDemoScreen gasto -MiBancoDemoMonth -1
          shot gasto-privado 10 -MiBancoDemoScreen gasto -MiBancoDemoPrivate
          shot gasto-categoria 10 -MiBancoDemoScreen gasto -MiBancoDemoCategory comerFuera
          shot presupuestos 10 -MiBancoDemoScreen gasto -MiBancoDemoBudgets
          shot suscripciones 10 -MiBancoDemoScreen gasto -MiBancoDemoSubscriptions
          shot avisos 10 -MiBancoDemoScreen avisos
          shot avisos-ajustes 10 -MiBancoDemoScreen avisos -MiBancoDemoRules
          shot ajustes 10 -MiBancoDemoScreen ajustes
          shot ajustes-copia 10 -MiBancoDemoScreen ajustes -MiBancoDemoBackup
          shot restaurar 10 -MiBancoDemoScreen ajustes -MiBancoDemoRestorePreview
          # La guia de avisos: la lista y pasos de Revolut (apagar «Notificar al ejecutar», rellenar «Titulo») y de Apple Pay.
          shot guia-avisos 10 -MiBancoDemoScreen ajustes -MiBancoDemoAlertsGuide rev 0
          shot guia-lista-media 10 -MiBancoDemoScreen ajustes -MiBancoDemoAlertsGuide rev 0 -MiBancoDemoGuideHalfway
          shot guia-escribir 10 -MiBancoDemoScreen ajustes -MiBancoDemoAlertsGuide rev 4
          shot guia-apagar 10 -MiBancoDemoScreen ajustes -MiBancoDemoAlertsGuide rev 10
          shot guia-campo 10 -MiBancoDemoScreen ajustes -MiBancoDemoAlertsGuide rev 19
          shot guia-ayuda 10 -MiBancoDemoScreen ajustes -MiBancoDemoGuideSeed rev 19 -MiBancoDemoGuideHelpOpen
          shot guia-cartera 10 -MiBancoDemoScreen ajustes -MiBancoDemoAlertsGuide wallet 6
          shot guia-cartera-banco 10 -MiBancoDemoScreen ajustes -MiBancoDemoAlertsGuide wallet 17
          # Con letra de accesibilidad el bloque de botones no debe apretar el contenido.
          xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large
          shot guia-letra-grande 10 -MiBancoDemoScreen ajustes -MiBancoDemoAlertsGuide rev 19
          xcrun simctl ui "$UDID" content_size large
          # La llegada entra a los ~4 s; a los ~9 s ya se ha asentado (saldo, total y fila nueva).
          shot llegada 9 -MiBancoDemoArrival
          # El bloqueo se quita solo a los ~4 s desde que la app pinta: a los ~3,5 s del lanzamiento todavia se ve.
          shot bloqueo 3.5 -MiBancoDemoLock
          if [ "${{ inputs.pequeno }}" = "true" ]; then
            shot guia-pequeno-lista 10 -MiBancoDemoScreen ajustes -MiBancoDemoAlertsGuide rev 0
            shot guia-pequeno-campo 10 -MiBancoDemoScreen ajustes -MiBancoDemoGuideSeed rev 19
            shot guia-pequeno-ayuda 10 -MiBancoDemoScreen ajustes -MiBancoDemoGuideSeed rev 19 -MiBancoDemoGuideHelpOpen
            shot guia-pequeno-apagar 10 -MiBancoDemoScreen ajustes -MiBancoDemoGuideSeed rev 10
            # Letra un punto y tres puntos mayor (sin ser de accesibilidad), retomando el paso 19.
            xcrun simctl ui "$UDID" content_size extra-large
            shot guia-pequeno-campo-xl 10 -MiBancoDemoScreen ajustes -MiBancoDemoGuideSeed rev 19
            xcrun simctl ui "$UDID" content_size extra-extra-extra-large
            shot guia-pequeno-campo-xxxl 10 -MiBancoDemoScreen ajustes -MiBancoDemoGuideSeed rev 19
            xcrun simctl ui "$UDID" content_size large
          fi
          # Galeria de movimiento (solo DEBUG): marca, cifras, controles, modo privado y movimiento reducido.
          shot motion-galeria 10 -MiBancoMotionGallery
          shot motion-galeria-cifras 10 -MiBancoMotionGallery -MiBancoMotionGalleryPage cifras
          shot motion-galeria-controles 10 -MiBancoMotionGallery -MiBancoMotionGalleryPage controles
          shot motion-galeria-privado 10 -MiBancoMotionGallery -MiBancoDemoPrivate -MiBancoMotionGalleryPage cifras
          # Fuera del entorno de preferencias y con el ojo cerrado guardado: el importe sigue oculto y no hay chip «Ojo».
          shot motion-galeria-sin-preferencias 10 -MiBancoMotionGallery -MiBancoMotionGalleryNoPrefs -MiBancoDemoPrivate -MiBancoMotionGalleryPage cifras
          shot motion-galeria-reducido 10 -MiBancoMotionGallery -MiBancoMotionReduce
          # Tamaño de texto más grande de accesibilidad: nada se recorta ni se pisa.
          shot motion-galeria-texto-grande 10 -MiBancoMotionGallery -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityXXXL
          shot motion-galeria-controles-texto-grande 10 -MiBancoMotionGallery -MiBancoMotionGalleryPage botones -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityXXXL
          # Filas con el texto más grande: el importe se encoge y el título cabe. (La de «segmentado» salía igual que «pasos»:
          # las dos anclas quedan a menos de una pantalla del final; el segmentado ya está entero en «controles».)
          shot motion-galeria-filas-texto-grande 10 -MiBancoMotionGallery -MiBancoMotionGalleryPage filas -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityXXXL
          shot motion-galeria-pasos-texto-grande 10 -MiBancoMotionGallery -MiBancoMotionGalleryPage pasos -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityXXXL
          ls -l out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: out/*.png
          if-no-files-found: warn
