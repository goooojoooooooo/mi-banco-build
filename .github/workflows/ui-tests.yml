name: ui-tests
run-name: ui-tests ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      test_class:
        description: "Clase de pruebas a ejecutar sola (vacio = todas)"
        required: false
        default: ""
      pequeno:
        description: "En un iPhone de 393 pt (iPhone 15/16), como en screenshots.yml"
        type: boolean
        default: false
      parallel_workers:
        description: "Pruebas en paralelo: numero de simuladores (>=2); vacio = en serie como hasta ahora"
        required: false
        default: ""
      runner:
        description: "Runner macOS (por defecto: namespace-profile-onyx; NO usar macos-15-intel)"
        required: false
        default: "namespace-profile-onyx"
permissions:
  contents: read
jobs:
  ui:
    runs-on: ${{ inputs.runner || 'namespace-profile-onyx' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Elegir Xcode (26.2 si existe; si no, el mas nuevo)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=/Applications/Xcode_26.2.app
          if [ ! -d "$XCODE" ]; then XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"; fi
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen
      - name: Crear y arrancar el simulador (maximo 10 min)
        timeout-minutes: 14
        run: |
          RUNTIME_LINE=$(xcrun simctl list runtimes available | grep -E "^iOS .*com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]+-[0-9]+$" | sort -V | tail -1 || true)
          if [ -z "$RUNTIME_LINE" ]; then
            RUNTIME_LINE=$(xcrun simctl list runtimes available | grep -E "^iOS " | sort -V | tail -1)
          fi
          RUNTIME=$(echo "$RUNTIME_LINE" | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.[^[:space:]]+")
          DEVICETYPE=$(xcrun simctl list devicetypes | grep -E "iPhone [0-9]+ Pro Max" | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/' | sort -V | tail -1)
          # Interruptor pequeno (G30 M5): exige un iPhone de 393 pt (15/16) y falla si no existe, sin elegir 402 pt en silencio.
          if [ "${{ inputs.pequeno }}" = "true" ]; then
            DEVICETYPE=$(xcrun simctl list devicetypes | grep -E "^iPhone (15|16) \(" | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/' | sort -V | head -1 || true)
            if [ -z "$DEVICETYPE" ]; then
              echo "No se encontro un simulador de 393 pt (iPhone 15 o 16) para pequeno=true"
              xcrun simctl list devicetypes | grep -E "^iPhone " || true
              exit 1
            fi
          fi
          echo "Runtime: $RUNTIME_LINE"
          echo "Dispositivo: $DEVICETYPE"
          UDID=$(xcrun simctl create "MiBancoUI" "$DEVICETYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          if ! perl -e 'alarm 600; exec @ARGV' xcrun simctl bootstatus "$UDID" -b; then
            echo "El simulador no arranco en 10 minutos"
            exit 1
          fi
          echo "### Entorno de pruebas de interfaz" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: $RUNTIME_LINE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dispositivo: $DEVICETYPE" >> "$GITHUB_STEP_SUMMARY"
      - name: Pruebas de toques
        env:
          TEST_CLASS: ${{ github.event.inputs.test_class }}
          PARALLEL_WORKERS: ${{ github.event.inputs.parallel_workers }}
        run: |
          mkdir -p build
          set +e
          if [ -n "$TEST_CLASS" ]; then
            case "$TEST_CLASS" in
              *[!A-Za-z0-9_]*) echo "test_class solo admite letras, numeros y _"; echo "2" > build/status.txt; tail -n 1 build/status.txt; exit 1 ;;
            esac
            SELECT="-only-testing:MiBancoUITests/$TEST_CLASS"
          else
            SELECT="-only-testing:MiBancoUITests -skip-testing:MiBancoUITests/MotionTourTests"
          fi
          if [ -n "$PARALLEL_WORKERS" ]; then
            case "$PARALLEL_WORKERS" in
              *[!0-9]*|0|1) echo "parallel_workers debe ser un numero >= 2"; echo "2" > build/status.txt; exit 1 ;;
            esac
            SELECT="$SELECT -parallel-testing-enabled YES -parallel-testing-worker-count $PARALLEL_WORKERS -maximum-parallel-testing-workers $PARALLEL_WORKERS"
          fi
          echo "SELECT=$SELECT" >> "$GITHUB_ENV"
          xcodebuild test -project MiBanco.xcodeproj -scheme MiBanco -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd -resultBundlePath build/ui.xcresult \
            $SELECT CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES > build/ui.log 2>&1
          echo "$?" > build/status.txt
          tail -n 60 build/ui.log
          exit 0
      # G26: a veces el simulador no deja arrancar las pruebas y ninguna llega a empezar («The test runner failed to
      # initialize for UI testing ... Timed out waiting for AX loaded notification»): se arranca otra vez el simulador
      # y se repite una sola vez la misma orden de «Pruebas de toques».
      - name: Reintento si las pruebas no llegaron a empezar
        run: |
          if [ "$(cat build/status.txt)" = "0" ] || grep -qE "^Test [Cc]ase " build/ui.log || ! grep -q "failed to initialize for UI testing" build/ui.log; then
            exit 0
          fi
          echo "== Las pruebas no llegaron a empezar =="
          grep -E "encountered an error" build/ui.log | head -n 5 || true
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl boot "$UDID"
          perl -e 'alarm 600; exec @ARGV' xcrun simctl bootstatus "$UDID" -b > /dev/null || echo "El simulador tarda en arrancar"
          mv build/ui.xcresult build/ui-primer-intento.xcresult || true
          set +e
          xcodebuild test -project MiBanco.xcodeproj -scheme MiBanco -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd -resultBundlePath build/ui.xcresult \
            $SELECT CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES > build/ui.log 2>&1
          echo "$?" > build/status.txt
          tail -n 60 build/ui.log
          exit 0
      - name: Resumen por prueba
        run: |
          echo "== Resultado por prueba =="
          grep -E "^Test [Cc]ase .* (passed|failed)" build/ui.log | tee build/summary.txt || true
          { echo "### Pruebas"; echo '```'; cat build/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # R31: lo que dejó la prueba de un solo toque por pestaña (rojo o verde): del log y, si no, del xcresult.
          echo "== R24: Cambio de pestaña con un solo toque =="
          grep -h "Cambio de pestaña con un solo toque" build/ui.log | sort -u > build/r24.txt || true
          if [ ! -s build/r24.txt ] && [ -d build/ui.xcresult ]; then
            python3 .github/scripts/r24_tab_times.py build/ui.xcresult > build/r24.txt || true
          fi
          if [ ! -s build/r24.txt ]; then echo "R24: la prueba no se ejecutó en esta tanda (o no dejó mensaje)" > build/r24.txt; fi
          cat build/r24.txt
          { echo "### R24: un solo toque por pestaña"; echo '```'; cat build/r24.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "xcodebuild exit: $(cat build/status.txt)"
          if [ "$(cat build/status.txt)" != "0" ]; then
            echo "== Lineas con error: de build/ui.log =="
            grep -E "error:" build/ui.log | sort -u | head -n 40 || true
          fi
          test "$(cat build/status.txt)" = "0"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-xcresult
          path: |
            build/ui.xcresult
            build/ui-primer-intento.xcresult
            build/ui.log
          if-no-files-found: warn
