name: ui-tests
run-name: ui-tests ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      test_class:
        description: "Clase de pruebas a ejecutar sola (vacio = todas)"
        required: false
        default: ""
      runner:
        description: "Runner macOS (por defecto: macos-15-intel)"
        required: false
        default: "macos-15-intel"
permissions:
  contents: read
jobs:
  ui:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Elegir Xcode (26.2 si existe; si no, el mas nuevo)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=/Applications/Xcode_26.2.app
          if [ ! -d "$XCODE" ]; then XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"; fi
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen
      - name: Crear y arrancar el simulador (maximo 10 min)
        timeout-minutes: 14
        run: |
          RUNTIME_LINE=$(xcrun simctl list runtimes available | grep -E "^iOS .*com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]+-[0-9]+$" | sort -V | tail -1 || true)
          if [ -z "$RUNTIME_LINE" ]; then
            RUNTIME_LINE=$(xcrun simctl list runtimes available | grep -E "^iOS " | sort -V | tail -1)
          fi
          RUNTIME=$(echo "$RUNTIME_LINE" | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.[^[:space:]]+")
          DEVICETYPE=$(xcrun simctl list devicetypes | grep -E "iPhone [0-9]+ Pro Max" | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/' | sort -V | tail -1)
          echo "Runtime: $RUNTIME_LINE"
          echo "Dispositivo: $DEVICETYPE"
          UDID=$(xcrun simctl create "MiBancoUI" "$DEVICETYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          if ! perl -e 'alarm 600; exec @ARGV' xcrun simctl bootstatus "$UDID" -b; then
            echo "El simulador no arranco en 10 minutos"
            exit 1
          fi
          echo "### Entorno de pruebas de interfaz" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: $RUNTIME_LINE" >> "$GITHUB_STEP_SUMMARY"
      - name: Pruebas de toques
        env:
          TEST_CLASS: ${{ github.event.inputs.test_class }}
        run: |
          mkdir -p build
          set +e
          if [ -n "$TEST_CLASS" ]; then
            case "$TEST_CLASS" in
              *[!A-Za-z0-9_]*) echo "test_class solo admite letras, numeros y _"; echo "2" > build/status.txt; tail -n 1 build/status.txt; exit 1 ;;
            esac
            SELECT="-only-testing:MiBancoUITests/$TEST_CLASS"
          else
            SELECT="-only-testing:MiBancoUITests -skip-testing:MiBancoUITests/MotionTourTests"
          fi
          xcodebuild test -project MiBanco.xcodeproj -scheme MiBanco -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd -resultBundlePath build/ui.xcresult \
            $SELECT CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES > build/ui.log 2>&1
          echo "$?" > build/status.txt
          tail -n 60 build/ui.log
          exit 0
      - name: Resumen por prueba
        run: |
          echo "== Resultado por prueba =="
          grep -E "^Test Case .* (passed|failed)" build/ui.log | tee build/summary.txt || true
          { echo "### Pruebas"; echo '```'; cat build/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "xcodebuild exit: $(cat build/status.txt)"
          if [ "$(cat build/status.txt)" != "0" ]; then
            echo "== Lineas con error: de build/ui.log =="
            grep -E "error:" build/ui.log | sort -u | head -n 40 || true
          fi
          test "$(cat build/status.txt)" = "0"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-xcresult
          path: |
            build/ui.xcresult
            build/ui.log
          if-no-files-found: warn
