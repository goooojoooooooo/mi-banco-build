name: ui-tests
run-name: ui-tests ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      pequeno:
        description: "En el iPhone mas pequeno que no es Max ni Plus (iPhone 15/16), como en screenshots.yml"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ui:
    runs-on: namespace-profile-onyx
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Elegir Xcode (26.2 si existe; si no, el mas nuevo)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=/Applications/Xcode_26.2.app
          if [ ! -d "$XCODE" ]; then XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"; fi
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen
      - name: Crear y arrancar el simulador (maximo 10 min)
        timeout-minutes: 14
        run: |
          RUNTIME_LINE=$(xcrun simctl list runtimes available | grep -E "^iOS .*com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]+-[0-9]+$" | sort -V | tail -1 || true)
          if [ -z "$RUNTIME_LINE" ]; then
            RUNTIME_LINE=$(xcrun simctl list runtimes available | grep -E "^iOS " | sort -V | tail -1)
          fi
          RUNTIME=$(echo "$RUNTIME_LINE" | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.[^[:space:]]+")
          DEVICETYPE=$(xcrun simctl list devicetypes | grep -E "iPhone [0-9]+ Pro Max" | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/' | sort -V | tail -1)
          # Interruptor pequeno: el mismo dispositivo que en screenshots.yml.
          if [ "${{ inputs.pequeno }}" = "true" ]; then
            DEVICETYPE=$(xcrun simctl list devicetypes | grep -E "^iPhone (15|16) \(" | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/' | sort -V | head -1 || true)
            if [ -z "$DEVICETYPE" ]; then
              DEVICETYPE=$(xcrun simctl list devicetypes | grep -E "^iPhone [0-9]+ \(" | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/' | sort -V | head -1)
            fi
          fi
          echo "Runtime: $RUNTIME_LINE"
          echo "Dispositivo: $DEVICETYPE"
          UDID=$(xcrun simctl create "MiBancoUI" "$DEVICETYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          if ! perl -e 'alarm 600; exec @ARGV' xcrun simctl bootstatus "$UDID" -b; then
            echo "El simulador no arranco en 10 minutos"
            exit 1
          fi
          echo "### Entorno de pruebas de interfaz" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: $RUNTIME_LINE" >> "$GITHUB_STEP_SUMMARY"
          # Interruptor pequeno: el resumen dice en que iPhone se ha probado.
          if [ "${{ inputs.pequeno }}" = "true" ]; then
            echo "- Dispositivo: $DEVICETYPE" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Pruebas de toques
        run: |
          mkdir -p build
          set +e
          xcodebuild test -project MiBanco.xcodeproj -scheme MiBanco -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd -resultBundlePath build/ui.xcresult \
            -only-testing:MiBancoUITests -skip-testing:MiBancoUITests/MotionTourTests CODE_SIGNING_ALLOWED=NO > build/ui.log 2>&1
          echo "$?" > build/status.txt
          tail -n 60 build/ui.log
          exit 0
      # A veces el simulador no deja arrancar las pruebas y ninguna llega a empezar («The test runner failed to
      # initialize for UI testing ... Timed out waiting for AX loaded notification»): se arranca otra vez el simulador
      # y se repite una sola vez la orden de «Pruebas de toques» (si cambia alli, cambiala aqui igual).
      - name: Reintento si las pruebas no llegaron a empezar
        run: |
          if [ "$(cat build/status.txt)" = "0" ] || grep -qE "^Test Case " build/ui.log || ! grep -q "failed to initialize for UI testing" build/ui.log; then
            exit 0
          fi
          echo "== Las pruebas no llegaron a empezar =="
          grep -E "encountered an error" build/ui.log | head -n 5 || true
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl boot "$UDID"
          perl -e 'alarm 600; exec @ARGV' xcrun simctl bootstatus "$UDID" -b > /dev/null || echo "El simulador tarda en arrancar"
          mv build/ui.xcresult build/ui-primer-intento.xcresult || true
          set +e
          xcodebuild test -project MiBanco.xcodeproj -scheme MiBanco -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd -resultBundlePath build/ui.xcresult \
            -only-testing:MiBancoUITests -skip-testing:MiBancoUITests/MotionTourTests CODE_SIGNING_ALLOWED=NO > build/ui.log 2>&1
          echo "$?" > build/status.txt
          tail -n 60 build/ui.log
          exit 0
      - name: Resumen por prueba
        run: |
          echo "== Resultado por prueba =="
          grep -E "^Test Case .* (passed|failed)" build/ui.log | tee build/summary.txt || true
          { echo "### Pruebas"; echo '```'; cat build/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "xcodebuild exit: $(cat build/status.txt)"
          if [ "$(cat build/status.txt)" != "0" ]; then
            echo "== Lineas con error: de build/ui.log =="
            grep -E "error:" build/ui.log | sort -u | head -n 40 || true
          fi
          test "$(cat build/status.txt)" = "0"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-xcresult
          path: |
            build/ui.xcresult
            build/ui-primer-intento.xcresult
            build/ui.log
          if-no-files-found: warn
