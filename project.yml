name: MiBanco
options:
  bundleIdPrefix: com.mibanco
  deploymentTarget:
    iOS: "18.0"
packages:
  Core:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  MiBanco:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
          - Resources/Logos
          - Resources/Logos/**
      - Shared/MovementActivityAttributes.swift
      # Logos de comercios y bancos (tools/fetch_logos.py): carpeta "Logos" dentro del paquete.
      - path: App/Resources/Logos
        type: folder
        buildPhase: resources
    dependencies:
      - package: Core
        product: MiBancoCore
      - target: MiBancoNotification
      - target: MiBancoWidgets
    scheme:
      testTargets:
        - MiBancoUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mibanco.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Mi Banco
        NSFaceIDUsageDescription: Para que solo tú veas tu dinero
        NSSupportsLiveActivities: true
        # Actualización de bancos en segundo plano (tarea 10)
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.mibanco.app.refresh]
        # Conexión bancaria (tarea 9): esquema de vuelta del banco
        CFBundleURLTypes:
          - CFBundleURLName: com.mibanco.app.callback
            CFBundleURLSchemes: [mibanco]
        LSApplicationQueriesSchemes: [revolut, imagin, traderepublic, shortcuts]
        ALTAppGroups: [group.com.mibanco.shared]
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/MiBanco.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mibanco.shared]
  MiBancoNotification:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationExt
        excludes:
          - Info.plist
          - "*.entitlements"
      - App/Theme.swift
      - App/Logos/BundledLogos.swift
      - path: App/Resources/Logos
        type: folder
        buildPhase: resources
    dependencies:
      - package: Core
        product: MiBancoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mibanco.app.notification
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
    info:
      path: NotificationExt/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Mi Banco
        ALTAppGroups: [group.com.mibanco.shared]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: MOVEMENT
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionUserInteractionEnabled: false
            UNNotificationExtensionInitialContentSizeRatio: 0.6
    entitlements:
      path: NotificationExt/MiBancoNotification.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mibanco.shared]
  MiBancoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - Shared/MovementActivityAttributes.swift
      - App/Theme.swift
      - App/Logos/BundledLogos.swift
      # Logos para la Live Activity y la Dynamic Island (los mismos que la app).
      - path: App/Resources/Logos
        type: folder
        buildPhase: resources
    dependencies:
      - package: Core
        product: MiBancoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mibanco.app.widgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Mi Banco
        ALTAppGroups: [group.com.mibanco.shared]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/MiBancoWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mibanco.shared]
  MiBancoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MiBanco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mibanco.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MiBanco
